<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1066 352" width="1066" height="352" role="img" aria-labelledby="t d">
<title id="t">Mnemento v0 benchmark: accuracy, time and tokens by number of records</title>
<desc id="d">Small multiples. B0 is measurable only at 100 records (context limit). The table in the README has every value.</desc>
<style>
.viz { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#8a8984; --grid:#e6e5e0;
       --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; }
@media (prefers-color-scheme: dark) {
  .viz { --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#8f8e86; --grid:#33332f;
         --s1:#3987e5; --s2:#d95926; --s3:#199e70; }
}
text { font-family: -apple-system, 'Segoe UI', Roboto, 'Noto Sans KR', sans-serif; fill: var(--ink2); }
.title { font-size: 13px; font-weight: 600; fill: var(--ink); }
.tick { font-size: 11px; fill: var(--muted); }
.label { font-size: 11px; fill: var(--ink2); }
.note { font-size: 10.5px; fill: var(--muted); }
.grid { stroke: var(--grid); stroke-width: 1; }
.axis { stroke: var(--muted); stroke-width: 1; }
</style>
<g class="viz"><rect width="1066" height="352" fill="var(--surface)"/>
<line x1="56" y1="22" x2="74" y2="22" stroke="var(--s1)" stroke-width="2"/><circle cx="65" cy="22" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/><text class="label" x="80" y="26">B0 full context</text>
<line x1="201.0" y1="22" x2="219.0" y2="22" stroke="var(--s2)" stroke-width="2"/><circle cx="210.0" cy="22" r="4" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"/><text class="label" x="225.0" y="26">B1 Claude Code memory</text>
<line x1="383.20000000000005" y1="22" x2="401.20000000000005" y2="22" stroke="var(--s3)" stroke-width="2"/><circle cx="392.20000000000005" cy="22" r="4" fill="var(--s3)" stroke="var(--surface)" stroke-width="2"/><text class="label" x="407.20000000000005" y="26">M Mnemento</text>
<text class="note" x="56" y="46">Reduced measurement: 12/20 questions (D1-D4, U1-U4, H1-H4), 3 repetitions, Mn at 100 only · model haiku · B0 not measurable at 1,000+ records (context limit)</text>
<text class="note" x="56" y="61">Note: B1 at 10,000 = 1 repetition (approved separately for cost)</text>
<text class="title" x="56" y="70">Accuracy (all 12 questions)</text>
<line class="grid" x1="56" y1="274.0" x2="306" y2="274.0"/><text class="tick" x="50" y="278.0" text-anchor="end">0%</text>
<line class="grid" x1="56" y1="226.5" x2="306" y2="226.5"/><text class="tick" x="50" y="230.5" text-anchor="end">25%</text>
