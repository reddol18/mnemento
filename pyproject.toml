[project]
name = "mnemento"
version = "0.1.0"
description = "A shared, structured record book for LLM agents — JSON documents + schema registry + event log on SQLite."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "reddol18", email = "dolja21@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.26.0",
    "mcp>=2.2",
    "tzdata>=2026.4",
]

[project.scripts]
mnemento-mcp = "mnemento.mcp_server:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
